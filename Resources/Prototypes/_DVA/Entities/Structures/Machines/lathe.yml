- type: entity
  parent: BaseLatheLube
  id: BaseTechFabDepartamental
  abstract: true
  components:
  - type: Sprite
    sprite: Structures/Machines/techfab.rsi
  - type: Lathe
    idleState: icon
    runningState: icon
  - type: OreSiloClient
  - type: EmagLatheRecipes
    emagStaticPacks:
    - SecurityAmmoStatic
    - SyndicateAmmoStatic
    emagDynamicPacks:
    - SecurityAmmo
    - SecurityExplosives
    - SecurityEquipment
    - SecurityWeapons
  - type: BlueprintReceiver
    whitelist:
      tags:
      - BlueprintAutolathe
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      blueprint: !type:Container
  - type: EmptyOnMachineDeconstruct
    containers:
    - blueprint

- type: entity
  parent: BaseTechFabDepartamental
  id: EngineeringTechFab
  name: engineering techfab
  description: Prints equipment for engineers.
  components:
  - type: Sprite
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: engi
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Lathe
    staticPacks:
    - ToolsStatic
    - PartsStatic
    - AtmosStatic
    - CablesStatic
    - PowerCellsStatic
    - ElectronicsStatic
    - LightsStatic
    - MaterialsStatic
    dynamicPacks:
    - AdvancedTools
    - PowerCells
    - AtmosTools
    - EngineeringWeapons
    - FauxTiles
    - Equipment
  - type: Machine
    board: EngineeringTechFabCircuitboard
  - type: LatheAnnouncing
    channels: [Engineering]

