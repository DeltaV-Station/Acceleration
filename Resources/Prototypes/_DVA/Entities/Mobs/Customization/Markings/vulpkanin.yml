# Limb markings

# All leg markings are on the left leg as the left leg sprite layers over right leg + its markings
# I *would* have split the limb markings left/right if it didn't just completely break from the right side
# Downside to combinde markings between limbs is that the portion of the marking for the right leg is just attached to the sprite for the left leg 
# This may cause visual problems with surgery/limb removals later


- type: marking
  id: VulpPointsCrestLegs
  bodyPart: LLeg
  groupWhitelist: [Vulpkanin]
  sprites:
    - sprite: _DVA/Mobs/Customization/Vulpkanin/body_markings.rsi
