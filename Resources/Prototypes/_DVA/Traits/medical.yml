- type: dvTrait
  id: LightweightDrunk
  name: trait-lightweight-name
  description: trait-lightweight-desc
  category: Medical
  effects:
  - !type:AddCompsEffect
    components:
    - type: LightweightDrunk
      boozeStrengthMultiplier: 2

- type: dvTrait
  id: Unrevivable
  name: trait-unrevivable-name
  description: trait-unrevivable-desc
  category: Medical
  effects:
  - !type:AddCompsEffect
    components:
    - type: Unrevivable
      cloneable: true

- type: dvTrait
  id: Uncloneable
  name: trait-uncloneable-name
  description: trait-uncloneable-desc
  category: Medical
  effects:
  - !type:AddCompsEffect
    components:
    - type: Unrevivable
      cloneable: false

