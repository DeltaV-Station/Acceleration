- type: dvTrait
  id: Accentless
  name: trait-accentless-name
  description: trait-accentless-desc
  category: Accents
  cost: 0
  effects:
  - !type:AddCompsEffect
    components:
    - type: Accentless
      removes:
      - type: LizardAccent
      - type: MothAccent
      - type: ReplacementAccent
        accent: dwarf

- type: dvTrait
  id: SocialAnxiety
  name: trait-socialanxiety-name
  description: trait-socialanxiety-desc
  category: Accents
  cost: 0
  effects:
  - !type:AddCompsEffect
    components:
    - type: StutteringAccent
      matchRandomProb: 0.1
      fourRandomProb: 0
      threeRandomProb: 0
      cutRandomProb: 0

- type: dvTrait
  id: FrontalLisp
  name: trait-frontal-lisp-name
  description: trait-frontal-lisp-desc
  category: Accents
  cost: 0
  effects:
  - !type:AddCompsEffect
    components:
    - type: FrontalLisp

