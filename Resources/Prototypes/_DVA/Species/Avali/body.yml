- type: entity
  parent:
  - AppearanceAvali
  - BaseSpeciesMobOrganic
  id: MobAvali
  name: Urist McWarble
  components:
  - type: Vocal
    emoteSounds: MaleAvali
  - type: Speech
    speechVerb: Avali
    speechSounds: MaleAvali
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#7a8bf2"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    damage:
      types:
        Slash: 6
    animation: WeaponArcClaw
  - type: Icon
    sprite: _DVA/Mobs/Species/Avali/parts.rsi
    state: full
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 160
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: AmmoniaBlood
        Quantity: 600
  - type: BonusMeleeDamage
    damageModifierSet:
      coefficients:
        Blunt: 0.65
        Slash: 0.85
  - type: Damageable
    damageModifierSet: Avali
  - type: Temperature
    currentTemperature: 296.15
    specificHeat: 25
  - type: TemperatureDamage
    heatDamageThreshold: 310
    coldDamageThreshold: 223
    coldDamage:
      types:
        Cold: 0.05
    heatDamage:
      types:
        Heat: 5
    damageCap: 20
  - type: ThermalRegulator
    metabolismHeat: 400
    radiatedHeat: 100
    implicitHeatRegulation: 500
    sweatHeatRegulation: 2000
    shiveringHeatRegulation: 2000
    normalBodyTemperature: 296.15
    thermalRegulationTemperatureThreshold: 10
  - type: TemperatureSpeed
    thresholds:
      279: 0.95
      265: 0.9
      240: 0.85
  - type: EyeCursorOffset
    maxOffset: 5
    pvsIncrease: 0.5
    enabled: false
  - type: DVInnateEyeOffset
  - type: ActionGrant
    actions:
    - ActionEyeZoom
  - type: DVPreenable
    featherPrototype: AvaliFeather
  - type: DVPreenOnDamaged
    featherPrototype: AvaliFeatherBloodied

